name: Codex PR review
run-name: Codex review PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  update-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.update.outputs.head_sha }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted workflow code
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update PR branch before review
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: >-
          python3 .github/scripts/codex_steward.py update-review-branch
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --github-output "$GITHUB_OUTPUT"

      - name: Report branch update setup failure
        if: failure() && steps.checkout.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "自动更新分支未启动，请检查本次运行：$RUN_URL"

  analyze:
    needs: update-branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PR review context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.update-branch.outputs.head_sha }}
        run: >-
          python3 .github/scripts/codex_steward.py prepare-review
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --output .codex-context
          --expected-head-sha "$EXPECTED_HEAD_SHA"

      - name: Review Skill changes
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ (vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL) && format('{0}/v1/responses', vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL) || '' }}
          model: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          effort: ${{ vars.OPENAI_REASONING_EFFORT || 'max' }}
          prompt-file: .github/codex/pr-review.md
          output-schema-file: .github/codex/result.schema.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          allow-bots: true
          codex-args: '["--ephemeral"]'

  execute:
    needs: analyze
    if: needs.analyze.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Save structured result
        env:
          CODEX_RESULT: ${{ needs.analyze.outputs.result }}
        run: >-
          python3 -c 'import os; from pathlib import Path;
          Path(".codex-result.json").write_text(os.environ["CODEX_RESULT"], encoding="utf-8")'

      - name: Apply PR review result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: >-
          python3 .github/scripts/codex_steward.py execute-review
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --result .codex-result.json

  report-analysis-failure:
    needs: analyze
    if: >-
      always() &&
      (needs.analyze.result == 'failure' ||
      needs.analyze.result == 'cancelled' ||
      (needs.analyze.result == 'success' && needs.analyze.outputs.result == ''))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report analysis failure
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@$OWNER

          ### 自动审查未完成

          请检查 OPENAI_API_KEY 和本次运行：$RUN_URL"
