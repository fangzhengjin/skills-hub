name: Codex steward

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codex-steward-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acknowledge:
    if: >-
      github.actor == github.repository_owner &&
      (github.event.comment.body == '/codex' ||
      startsWith(github.event.comment.body, '/codex '))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Acknowledge owner command
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: >-
          gh api --silent --method POST
          "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions"
          -f content=eyes

  analyze:
    if: >-
      github.actor == github.repository_owner &&
      (github.event.comment.body == '/codex' ||
      startsWith(github.event.comment.body, '/codex '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review context
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/codex_steward.py prepare
          --event "$GITHUB_EVENT_PATH"
          --output .codex-context

      - name: Review owner instruction
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ (vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL) && format('{0}/v1/responses', vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL) || '' }}
          model: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          effort: ${{ vars.OPENAI_REASONING_EFFORT || 'max' }}
          prompt-file: .github/codex/steward.md
          output-schema-file: .github/codex/result.schema.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

  execute:
    needs: analyze
    if: needs.analyze.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pr_number: ${{ steps.execute.outputs.pr_number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Save structured result
        env:
          CODEX_RESULT: ${{ needs.analyze.outputs.result }}
        run: >-
          python3 -c 'import os; from pathlib import Path;
          Path(".codex-result.json").write_text(os.environ["CODEX_RESULT"], encoding="utf-8")'

      - name: Execute authorized action
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/codex_steward.py execute
          --event "$GITHUB_EVENT_PATH"
          --result .codex-result.json
          --github-output "$GITHUB_OUTPUT"

  dispatch-review:
    needs: execute
    if: needs.execute.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    steps:
      - name: Start PR review workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ needs.execute.outputs.pr_number }}
        run: >-
          gh workflow run codex-review.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$DEFAULT_BRANCH"
          -f "pr_number=$PR_NUMBER"

      - name: Report review dispatch failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ needs.execute.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@$OWNER

          ### 自动审查未启动

          请检查本次运行并重试：$RUN_URL"

  report-analysis-failure:
    needs: analyze
    if: >-
      always() &&
      (needs.analyze.result == 'failure' ||
      (needs.analyze.result == 'success' && needs.analyze.outputs.result == ''))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report analysis failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh issue comment "$ISSUE_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --body "Codex 分析没有完成，请检查 OPENAI_API_KEY 和本次运行：$RUN_URL"
